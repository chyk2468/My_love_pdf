<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Local PDF Toolbox Data Flow</title>
  <desc id="svg-desc">Ingress, Transformation, and Egress</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0F1E2E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1E2E"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06B6D4" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#1B334D" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>
  <text x="48" y="46" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">LOCAL PDF TOOLBOX DATA FLOW</text>
  <text x="48" y="70" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">Ingress, Transformation, and Egress</text>
  <g filter="url(#glow)">
    <rect x="48" y="100" width="260" height="204" rx="12" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="48" y="100" width="260" height="5" rx="2.5" fill="#06B6D4"/>
    <text x="64" y="132" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">01 / INGEST</text>
    <text x="64" y="160" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Raw Input</text>
    <text x="64" y="188" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">User prompt, uploaded</text>
    <text x="64" y="206" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">file, or event payload</text>
  </g>
  <path d="M 311 202.0 L 323 202.0" stroke="#93C5FD" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 319 198.0 L 324 202.0 L 319 206.0" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="328" y="100" width="260" height="204" rx="12" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="328" y="100" width="260" height="5" rx="2.5" fill="#3B82F6"/>
    <text x="344" y="132" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">02 / PARSE</text>
    <text x="344" y="160" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Validation</text>
    <text x="344" y="188" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">Schema verification,</text>
    <text x="344" y="206" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">tokenization &amp;</text>
    <text x="344" y="224" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">normalization</text>
  </g>
  <path d="M 591 202.0 L 603 202.0" stroke="#93C5FD" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 599 198.0 L 604 202.0 L 599 206.0" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="608" y="100" width="260" height="204" rx="12" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="608" y="100" width="260" height="5" rx="2.5" fill="#06B6D4"/>
    <text x="624" y="132" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">03 / PROCESS</text>
    <text x="624" y="160" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Core Logic</text>
    <text x="624" y="188" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">Model inference,</text>
    <text x="624" y="206" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">transformation, or</text>
    <text x="624" y="224" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">pipeline execution</text>
  </g>
  <path d="M 871 202.0 L 883 202.0" stroke="#93C5FD" stroke-width="1.8" stroke-dasharray="2,2"/>
  <path d="M 879 198.0 L 884 202.0 L 879 206.0" fill="none" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="888" y="100" width="260" height="204" rx="12" fill="#0F1E2E" stroke="#1B334D" stroke-width="1.2"/>
    <rect x="888" y="100" width="260" height="5" rx="2.5" fill="#3B82F6"/>
    <text x="904" y="132" fill="#3B82F6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">04 / PRESENT</text>
    <text x="904" y="160" fill="#F0F9FF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Output Delivery</text>
    <text x="904" y="188" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">Formatted UI</text>
    <text x="904" y="206" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">rendering, structured</text>
    <text x="904" y="224" fill="#93C5FD" font-family="system-ui, -apple-system, sans-serif" font-size="12">JSON, or file save</text>
  </g>
</svg>
