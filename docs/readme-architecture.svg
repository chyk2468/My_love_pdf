<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">PDF Toolbox workflow</title><desc id="desc">The Streamlit UI routes a selected tool to a dedicated module for merging, splitting, compressing, or converting a PDF.</desc><rect width="1200" height="400" rx="18" fill="#10121C"/><text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6D83C9">PROJECT MAP / WORKFLOW</text><text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#F1F3FA">PDF Toolbox</text><text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#A5ACC0">Select a PDF task and download the result</text><line x1="56" y1="125" x2="1144" y2="125" stroke="#303449"/><path d="M 300 237 L 330 237" stroke="#A5ACC0" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#A5ACC0" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#A5ACC0" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#A5ACC0" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#A5ACC0" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#A5ACC0" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#1A1D2B" stroke="#303449" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#6D83C9"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6D83C9">01 / SELECT TOOL</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Choose an operation</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A5ACC0">Pick merge, split, compress, or convert.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#1A1D2B" stroke="#303449" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#4F9B91"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#4F9B91">02 / UPLOAD</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Provide source files</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A5ACC0">Load the PDF input through the UI.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#1A1D2B" stroke="#303449" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#C19B60"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#C19B60">03 / PROCESS</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Dedicated module</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A5ACC0">Run the selected transformation.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#1A1D2B" stroke="#303449" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#6D83C9"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6D83C9">04 / DOWNLOAD</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#F1F3FA">Save the output</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A5ACC0">Return the generated file.</text></g><text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#6D83C9">IMPLEMENTATION NOTE</text><text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#A5ACC0">PDF conversion fidelity depends on input structure and the selected conversion method.</text></svg>